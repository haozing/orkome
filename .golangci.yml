version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        domain-purity:
          files:
            - "**/domain/**"
          allow:
            - "$gostd"
            - orkome/internal/contract
        app-surface:
          files:
            - "**/app/**"
          allow:
            - "$gostd"
            - orkome/internal/contract
            - orkome/internal/platform
            - orkome/internal/**/domain
            - github.com/haozing/ploykit
          deny:
            - pkg: orkome/internal/**/adapters
              desc: "app must not import own-domain or foreign-domain adapters (internal archive 02 §4 rules 2/3)"
        no-cross-domain:
          files:
            - "**/app/**"
            - "**/adapters/**"
          deny:
            - pkg: orkome/internal/**/adapters
              desc: "adapters must not import each other (internal archive 02 §4 rules 3/4)"
