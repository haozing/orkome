<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2318181b%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2719%27 font-family=%27serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23fafafa%27%3EO%3C/text%3E%3C/svg%3E"
    />
    <title>Orkome</title>
    <script>
      try {
        var raw = localStorage.getItem('orkome.ui')
        if (raw && JSON.parse(raw).state.theme === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
